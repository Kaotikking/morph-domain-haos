name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install public test dependency
        run: python -m pip install pytest
      - name: Run public unit tests
        run: python -m pytest -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

