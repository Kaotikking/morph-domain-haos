morph_place:
  name: Move Morph
  description: Move a HAOS-owned Morph between the five canonical places.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:
    place:
      name: Place
      required: true
      selector:
        select:
          options: [VOID, NURSERY, SEREIN_GARDENS, HORIZON, CODE_HAVEN]

morph_care:
  name: Care for Morph
  description: Apply one idempotent care interaction to a HAOS-owned Morph.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:
    action:
      name: Care action
      required: true
      selector:
        select:
          options: [FEED, WATER, PLAY, REST]

return_to_birth_frame:
  name: Return Morph to birth frame
  description: Run the complete destination-owned return reflex and release HAOS custody only after durable frame staging.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:

recall_to_horizon:
  name: Recall Morph to Horizon
  description: Freeze the admitted birth frame, import its current nine-core snapshot, commit HAOS custody, and place the Morph in Horizon.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:

code_haven_admit:
  name: Admit Morph to Code Haven
  description: Preserve the prior place and digest, then enter the only Morph-state write boundary.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:
    reason:
      name: Diagnostic reason
      required: false
      selector:
        text:

code_haven_discharge:
  name: Discharge Morph from Code Haven
  description: Release a Morph only against its open Code Haven admission receipt.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:
    target_place:
      name: Destination
      required: false
      default: HORIZON
      selector:
        select:
          options: [HORIZON]

nursery_pair_admit:
  name: Admit Morph pair to Nursery
  description: Atomically admit two eligible Morphs and begin the five-second compatibility window.
  fields:
    first_morph_id:
      name: First Morph ID
      required: true
      selector:
        text:
    second_morph_id:
      name: Second Morph ID
      required: true
      selector:
        text:

recover_transfers:
  name: Recover interrupted Morph transfers
  description: Reconcile expired and interrupted transactions without inventing custody or identity.

void_enter:
  name: Enter Void stasis
  description: Snapshot the Morph, stop time, and enforce the canonical 24-hour withdrawal lock.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:

void_withdraw:
  name: Withdraw from Void
  description: Restore the exact stasis snapshot after the lock, routing to Horizon or Code Haven.
  fields:
    morph_id:
      name: Morph ID
      required: true
      selector:
        text:
    target_place:
      name: Destination
      required: false
      default: HORIZON
      selector:
        select:
          options: [HORIZON, CODE_HAVEN]
battle_spar:
  name: Start unranked Morph spar
  description: Resolve one deterministic, non-destructive beta battle between two HAOS-owned Morphs in Horizon or Gardens.
  fields:
    first_morph_id:
      required: true
      selector:
        text:
    second_morph_id:
      required: true
      selector:
        text:

